name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy python3 \
            meson ninja-build pkg-config \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev

      - name: Run checks
        run: python3 scripts/checkpatch.py

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config g++ python3-pytest \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev

      - name: Build
        run: |
          meson setup build --buildtype=debug \
            -Dcxx_bindings=enabled -Dpython_bindings=enabled
          meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config clang python3-pytest \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev

      - name: Build with sanitizers
        run: |
          CC=clang CXX=clang++ meson setup build-san \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dcxx_bindings=enabled -Dpython_bindings=enabled
          meson compile -C build-san

      - name: Test
        run: meson test -C build-san --print-errorlogs

  tsan:
    name: Sanitizer (TSan)
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config clang python3-pytest \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev

      - name: Build with ThreadSanitizer
        run: |
          CC=clang CXX=clang++ meson setup build-tsan \
            --buildtype=debug \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dcxx_bindings=enabled -Dpython_bindings=enabled
          meson compile -C build-tsan

      # apg-test excluded: it exercises run_script()'s
      # unshare(CLONE_NEWUSER) sandboxing, which requires a single-threaded
      # caller. TSan's runtime spawns background threads even in code that
      # looks single-threaded, so unshare() there always fails with EINVAL
      # under TSan, regardless of libapg's own code.
      - name: Test
        run: |
          meson test -C build-tsan --print-errorlogs \
            sat-test apgxx-bindings apgpy-bindings

  fuzz:
    name: Fuzzing (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config clang \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev

      - name: Build fuzzers
        run: |
          CC=clang meson setup build-fuzz \
            --buildtype=debug \
            -Dfuzzing=enabled \
            -Db_lundef=false
          meson compile -C build-fuzz fuzz/fuzz-package-json fuzz/fuzz-dep-constraint

      - name: Run fuzz-package-json
        run: |
          export LD_PRELOAD="$(clang -print-runtime-dir)/libclang_rt.asan-x86_64.so"
          ./build-fuzz/fuzz/fuzz-package-json -max_total_time=60 fuzz/corpus/package-json

      - name: Run fuzz-dep-constraint
        run: |
          export LD_PRELOAD="$(clang -print-runtime-dir)/libclang_rt.asan-x86_64.so"
          ./build-fuzz/fuzz/fuzz-dep-constraint -max_total_time=60 fuzz/corpus/dep-constraint

  abi-check:
    name: ABI regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            libarchive-dev liblmdb-dev libseccomp-dev \
            libsodium-dev abigail-tools

      - name: Determine previous release tag
        id: prev
        env:
          ABI_BASELINE_TAG: ''
        run: |
          echo "tag=$ABI_BASELINE_TAG" >> "$GITHUB_OUTPUT"
          echo "Comparing against: ${ABI_BASELINE_TAG:-<none, no baseline tag pinned yet>}"

      - name: Build current
        if: steps.prev.outputs.tag != ''
        run: |
          meson setup build-abi-current --buildtype=debug
          meson compile -C build-abi-current

      - name: Build previous release (${{ steps.prev.outputs.tag }})
        if: steps.prev.outputs.tag != ''
        run: |
          git worktree add /tmp/abi-baseline "${{ steps.prev.outputs.tag }}"
          cd /tmp/abi-baseline
          meson setup build --buildtype=debug
          meson compile -C build

      - name: Compare ABI against ${{ steps.prev.outputs.tag }}
        if: steps.prev.outputs.tag != ''
        run: |
          abidw "$(readlink -f build-abi-current/libapg.so)" > current.xml
          abidw "$(readlink -f /tmp/abi-baseline/build/libapg.so)" > baseline.xml

          set +e
          abidiff --suppressions abi-suppressions.txt --exported-interfaces-only baseline.xml current.xml
          STATUS=$?
          set -e
          echo "abidiff exit status: $STATUS"

          if [ $((STATUS & 1)) -ne 0 ] || [ $((STATUS & 2)) -ne 0 ]; then
            echo "abidiff failed to run correctly (exit $STATUS) -- tooling problem, not an ABI verdict"
            exit 1
          fi

          if [ $((STATUS & 8)) -ne 0 ]; then
            echo
            echo "Incompatible ABI change detected against ${{ steps.prev.outputs.tag }}."
            echo "If intentional, document it under a 'Breaking:' bullet in CHANGELOG.md and bump the version in meson.build before release (soversion tracks the full project version, so the SONAME must change too)."
            exit 1
          fi

  cross-aarch64:
    name: Cross-compile (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add arm64 architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -name '*.list' \
            -exec sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' {} +
          sudo find /etc/apt/sources.list.d/ -name '*.sources' \
            -exec sed -i '/^Architectures:/d; /^Types:/i Architectures: amd64' {} +
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/arm64-ports.list << EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main restricted universe
          EOF
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            meson ninja-build pkg-config \
            libarchive-dev:arm64 \
            liblmdb-dev:arm64 \
            libsodium-dev:arm64 \
            libseccomp-dev:arm64

      - name: Cross-compile
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          meson setup build-aarch64 \
            --cross-file cross/cross-aarch64.txt \
            --buildtype=release
          meson compile -C build-aarch64

  cross-riscv64:
    name: Cross-compile (riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add riscv64 architecture
        run: |
          sudo dpkg --add-architecture riscv64
          sudo sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -name '*.list' \
            -exec sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' {} +
          sudo find /etc/apt/sources.list.d/ -name '*.sources' \
            -exec sed -i '/^Architectures:/d; /^Types:/i Architectures: amd64' {} +
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/riscv64-ports.list << EOF
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main restricted universe
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main restricted universe
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main restricted universe
          EOF
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            clang lld llvm \
            gcc-riscv64-linux-gnu \
            meson ninja-build pkg-config \
            libarchive-dev:riscv64 \
            liblmdb-dev:riscv64 \
            libsodium-dev:riscv64 \
            libseccomp-dev:riscv64

      - name: Cross-compile
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          meson setup build-riscv64 \
            --cross-file cross/cross-riscv64.txt \
            --buildtype=release
          meson compile -C build-riscv64

  cross-mips64el:
    name: Cross-compile (mips64el)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add mips64el architecture
        run: |
          sudo dpkg --add-architecture mips64el
          sudo sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -name '*.list' \
            -exec sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' {} +
          sudo find /etc/apt/sources.list.d/ -name '*.sources' \
            -exec sed -i '/^Architectures:/d; /^Types:/i Architectures: amd64' {} +
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/mips64el-ports.list << EOF
          deb [arch=mips64el] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main restricted universe
          deb [arch=mips64el] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main restricted universe
          deb [arch=mips64el] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main restricted universe
          EOF
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            clang lld llvm \
            gcc-mips64el-linux-gnuabi64 \
            meson ninja-build pkg-config \
            cmake autoconf automake libtool gperf

      - name: Build cross libs for mips64el
        run: |
          TRIPLET=mips64el-linux-gnuabi64
          SYSROOT=/usr/lib/${TRIPLET}
          sudo mkdir -p ${SYSROOT}/pkgconfig
          CC="clang --target=${TRIPLET}"

          # zlib (required by libarchive)
          curl -fsSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz -C /tmp
          cd /tmp/zlib-1.3.1
          CC="${CC}" ./configure --prefix=/usr --libdir=${SYSROOT} --static
          make -j$(nproc) && sudo make install
          printf 'Name: zlib\nVersion: 1.3.1\nLibs: -L%s -lz\nCflags: -I/usr/include\n' "${SYSROOT}" | sudo tee ${SYSROOT}/pkgconfig/zlib.pc

          # libsodium
          curl -fsSL https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz | tar xz -C /tmp
          cd /tmp/libsodium-1.0.20
          ./configure --host=${TRIPLET} CC="${CC}" --prefix=/usr --libdir=${SYSROOT} --disable-shared
          make -j$(nproc) && sudo make install
          printf 'Name: libsodium\nVersion: 1.0.20\nLibs: -L%s -lsodium\nCflags: -I/usr/include\n' "${SYSROOT}" | sudo tee ${SYSROOT}/pkgconfig/libsodium.pc

          # lmdb
          curl -fsSL https://github.com/LMDB/lmdb/archive/refs/tags/LMDB_0.9.32.tar.gz | tar xz -C /tmp
          cd /tmp/lmdb-LMDB_0.9.32/libraries/liblmdb
          make CC="clang --target=${TRIPLET}" liblmdb.a
          sudo cp liblmdb.a ${SYSROOT}/liblmdb.a
          sudo cp lmdb.h /usr/include/lmdb.h
          printf 'Name: lmdb\nVersion: 0.9.32\nLibs: -L%s -llmdb\nCflags: -I/usr/include\n' "${SYSROOT}" | sudo tee ${SYSROOT}/pkgconfig/lmdb.pc

          # libarchive (with zlib)
          curl -fsSL https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz | tar xz -C /tmp
          cd /tmp/libarchive-3.7.4
          CFLAGS="-I/usr/include" LDFLAGS="-L${SYSROOT}" \
          ./configure --host=${TRIPLET} CC="${CC}" --prefix=/usr --libdir=${SYSROOT} --disable-shared \
            --without-bz2lib --without-libb2 --without-iconv --without-lz4 --without-zstd \
            --without-lzma --without-cng --without-xml2 --without-expat --with-zlib
          make -j$(nproc) && sudo make install
          printf 'Name: libarchive\nVersion: 3.7.4\nLibs: -L%s -larchive -lz\nCflags: -I/usr/include\n' "${SYSROOT}" | sudo tee ${SYSROOT}/pkgconfig/libarchive.pc

          # libseccomp
          curl -fsSL https://github.com/seccomp/libseccomp/releases/download/v2.5.5/libseccomp-2.5.5.tar.gz | tar xz -C /tmp
          cd /tmp/libseccomp-2.5.5
          ./configure --host=${TRIPLET} CC="${CC}" --prefix=/usr --libdir=${SYSROOT} --disable-shared
          make -j$(nproc) && sudo make install
          printf 'Name: libseccomp\nVersion: 2.5.5\nLibs: -L%s -lseccomp\nCflags: -I/usr/include\n' "${SYSROOT}" | sudo tee ${SYSROOT}/pkgconfig/libseccomp.pc

      - name: Cross-compile
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/mips64el-linux-gnuabi64/pkgconfig:/usr/share/pkgconfig
        run: |
          meson setup build-mips64el \
            --cross-file cross/cross-mips64.txt \
            --buildtype=release
          meson compile -C build-mips64el

  cross-armhf:
    name: Cross-compile (armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add armhf architecture
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -name '*.list' \
            -exec sed -i '/^deb \[/!s/^deb /deb [arch=amd64] /' {} +
          sudo find /etc/apt/sources.list.d/ -name '*.sources' \
            -exec sed -i '/^Architectures:/d; /^Types:/i Architectures: amd64' {} +
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/armhf-ports.list << EOF
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main restricted universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main restricted universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main restricted universe
          EOF
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            clang lld llvm \
            gcc-arm-linux-gnueabihf \
            meson ninja-build pkg-config \
            libarchive-dev:armhf \
            liblmdb-dev:armhf \
            libsodium-dev:armhf \
            libseccomp-dev:armhf

      - name: Cross-compile
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
        run: |
          meson setup build-armhf \
            --cross-file cross/cross-arm.txt \
            --buildtype=release
          meson compile -C build-armhf

  freebsd:
    name: Build (FreeBSD x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and test on FreeBSD
        uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee # v1.3.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.3'
          run: |
            sudo pkg install -y meson pkgconf ninja lmdb libarchive libsodium
            meson setup build --buildtype=release
            meson compile -C build
            meson test -C build
